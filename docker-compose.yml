services:
  calculator:
    build: .
    image: pranav0307/calculator-devops:latest
    container_name: calculator-app
    expose:
      - "8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:alpine
    container_name: calculator-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
